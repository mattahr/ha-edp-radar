# Example Lovelace view for the European Defence Procurement Radar.
#
# Paste into a dashboard in YAML mode (Settings → Dashboards → ⋮ → Raw
# configuration editor) or copy individual cards. Entity ids follow the
# pattern <device>_<entity name>; adjust them if your Home Assistant language
# is not English or if you renamed entities.

title: Defence procurement
views:
  # Phase 2: the country-first view. Entity ids assume My country = Sweden;
  # replace "sweden" with your country's name.
  - title: Countries
    path: countries
    cards:
      # §19 My country in a few seconds.
      - type: grid
        title: My country — Sweden
        columns: 2
        cards:
          - type: tile
            entity: sensor.my_country_sweden_awarded_value_12_m
            name: Awarded value 12 m
          - type: tile
            entity: sensor.my_country_sweden_country_rank_12_m
            name: Rank
          - type: tile
            entity: sensor.my_country_sweden_share_of_european_total_12_m
            name: Share
          - type: tile
            entity: sensor.my_country_sweden_awarded_value_previous_12_m
            name: Previous 12 m
          - type: tile
            entity: sensor.my_country_sweden_awarded_value_change
            name: Change
          - type: tile
            entity: sensor.my_country_sweden_value_coverage_12_m
            name: Value coverage
      - type: entities
        title: Europe — 12 months
        entities:
          - entity: sensor.european_purchasing_total_awarded_value_12_m
            name: Awarded value
          - entity: sensor.european_purchasing_largest_buyer_country_12_m
            name: Largest buyer
          - entity: sensor.european_purchasing_largest_buyer_value_12_m
            name: Largest buyer value
          - entity: sensor.european_purchasing_joint_multinational_value_12_m
            name: Joint / multinational
          - entity: sensor.european_purchasing_countries_with_attributable_value_12_m
            name: Countries with value
      # §26 Who buys the most: bars from the ranking attribute, My country marked.
      - type: markdown
        title: Awarded defence contract value — 12 months
        content: >
          {% set s = states.sensor.country_ranking_country_ranking_12_m %}
          {% set top = s.attributes.ranking[0].value_eur or 1 %}
          {% for r in s.attributes.ranking %}
          {% set bar = ((r.value_eur or 0) / top * 20) | round(0, 'ceil') | int %}
          {{ '**' if r.is_my_country }}{{ r.rank }}. {{ r.country }}{{ '**' if r.is_my_country }}
          `{{ '█' * bar }}{{ '░' * (20 - bar) }}` EUR {{ '%.1f' | format((r.value_eur or 0) / 1e9) }} bn
          · {{ r.share_pct }} % · coverage {{ r.value_coverage_pct }} %
          {% endfor %}
          {% if s.attributes.unranked %}

          *Awards without a usable value:* {{ s.attributes.unranked | map(attribute='country') | join(', ') }}
          {% endif %}
      # §20 What does my country buy?
      - type: markdown
        title: My country — awarded value by category, 12 months
        content: >
          {% set s = states.sensor.my_country_sweden_top_category_12_m %}
          | Category | EUR | Share | Awards |
          |---|---|---|---|
          {% for c in s.attributes.categories %}
          | {{ c.label }} | {{ '%.0f' | format((c.value_eur or 0) / 1e6) }} m | {{ c.share_pct }} % | {{ c.awards }} |
          {% endfor %}
      # §22 Largest awards behind the total, each linked to TED.
      - type: markdown
        title: My country — largest awards, 12 months
        content: >
          {% for a in state_attr('sensor.my_country_sweden_largest_award_12_m', 'largest_awards') or [] %}
          - **EUR {{ '%.0f' | format((a.value_eur or 0) / 1e6) }} m** · {{ a.category }} · [{{ a.title }}]({{ a.ted_url }}) — {{ a.buyer }}, {{ a.award_date }}
          {% endfor %}
      # §27 Trend: the rolling 12-month line, straight from the recorder.
      - type: history-graph
        title: Rolling 12-month awarded value
        hours_to_show: 2160
        entities:
          - entity: sensor.my_country_sweden_awarded_value_12_m
      - type: entities
        title: Text summaries
        entities:
          - sensor.my_country_sweden_summary
          - sensor.european_purchasing_top_buyers
          - sensor.my_country_sweden_categories
  - title: Radar
    path: radar
    cards:
      # 26.1 Snapshot: plain tiles, no thresholds or colours.
      - type: grid
        title: European defence market
        columns: 2
        cards:
          - type: tile
            entity: sensor.european_defence_market_new_competitions_30_d
            name: New competitions 30 d
          - type: tile
            entity: sensor.european_defence_market_new_competitions_90_d
            name: New competitions 90 d
          - type: tile
            entity: sensor.european_defence_market_estimated_value_30_d
            name: Estimated value 30 d
          - type: tile
            entity: sensor.european_defence_market_award_value_30_d
            name: Award value 30 d
          - type: tile
            entity: sensor.european_defence_market_top_country_by_value_90_d
            name: Top country 90 d
          - type: tile
            entity: sensor.european_defence_market_top_category_by_value_90_d
            name: Top category 90 d

      - type: markdown
        content: >
          {{ states('sensor.european_defence_market_snapshot') }}

          {{ states('sensor.european_defence_market_country_ranking') }}

      # 26.2 Trend: the rolling 30-day windows over time.
      - type: history-graph
        title: 30-day rolling windows
        hours_to_show: 2160
        entities:
          - entity: sensor.european_defence_market_new_competitions_30_d
          - entity: sensor.european_defence_market_estimated_value_30_d
          - entity: sensor.european_defence_market_award_value_30_d

      # 26.3 Country comparison from the ranking attribute.
      - type: markdown
        title: Countries by estimated value, last 90 days
        content: >
          {% set s = states.sensor.european_defence_market_top_country_by_value_90_d %}
          {% if s is not none and s.attributes.ranking is defined %}
          | # | Country | EUR | Procedures | vs prev. 90 d |
          |---|---|---|---|---|
          {% for r in s.attributes.ranking %}
          | {{ r.rank }} | {{ r.key }} | {{ '%.2f' | format((r.value_eur or 0) / 1e9) }} bn | {{ r.procedures }} | {{ (r.change_pct ~ ' %') if r.change_pct is not none else '–' }} |
          {% endfor %}

          *{{ s.attributes.population_size }} countries: {{ s.attributes.population }}.*
          {% else %}
          Waiting for the first TED bootstrap…
          {% endif %}

      # 26.4 Capability comparison.
      - type: markdown
        title: Strategic categories, last 90 days
        content: >
          {% set s = states.sensor.european_defence_market_top_category_by_value_90_d %}
          {% if s is not none and s.attributes.ranking is defined %}
          | # | Category | EUR | Procedures | vs prev. 90 d |
          |---|---|---|---|---|
          {% for r in s.attributes.ranking %}
          | {{ r.rank }} | {{ r.label }} | {{ '%.2f' | format((r.value_eur or 0) / 1e9) }} bn | {{ r.procedures }} | {{ (r.change_pct ~ ' %') if r.change_pct is not none else '–' }} |
          {% endfor %}
          {% endif %}

      # External radar: the largest things published in the last week.
      - type: entities
        title: External radar, last 7 days
        entities:
          - entity: sensor.external_radar_new_competitions_7_d
          - entity: sensor.external_radar_largest_competition_7_d
          - entity: sensor.external_radar_largest_award_7_d
          - entity: sensor.external_radar_latest_competition

      # Competition metrics with their coverage in the secondary text.
      - type: entities
        title: Competition, last 365 days
        entities:
          - entity: sensor.european_defence_market_median_tenders_per_lot_365_d
            secondary_info: attribute
            attribute: coverage_pct
          - entity: sensor.european_defence_market_single_bid_share_365_d
            secondary_info: attribute
            attribute: coverage_pct
          - entity: sensor.european_defence_market_median_public_time_to_result_365_d
            secondary_info: attribute
            attribute: procedure_link_coverage_pct

  # Raw data device (only when a raw-data country is configured).
  - title: Sweden raw
    path: sweden-raw
    cards:
      - type: entities
        title: Sweden – counts
        entities:
          - sensor.raw_data_sweden_notices_7_d
          - sensor.raw_data_sweden_competitions_30_d
          - sensor.raw_data_sweden_results_30_d
          - sensor.raw_data_sweden_changes_30_d
          - sensor.raw_data_sweden_stored_notices
      - type: markdown
        title: Latest Swedish competitions
        content: >
          {% for n in state_attr('sensor.raw_data_sweden_competitions_30_d', 'notices') or [] %}
          - **{{ n.publication_date }}** [{{ n.title }}]({{ n.ted_url }}) — {{ n.buyer }}
            {% if n.estimated_value_eur %}· EUR {{ '%.1f' | format(n.estimated_value_eur / 1e6) }}m{% endif %}
          {% endfor %}
      - type: markdown
        title: Latest Swedish results
        content: >
          {% for n in state_attr('sensor.raw_data_sweden_results_30_d', 'notices') or [] %}
          - **{{ n.publication_date }}** [{{ n.title }}]({{ n.ted_url }}) — {{ n.buyer }}
            {% if n.winners %}→ {{ n.winners | join(', ') }}{% endif %}
            {% if n.result_value_eur %}· EUR {{ '%.1f' | format(n.result_value_eur / 1e6) }}m{% endif %}
            {% if n.tenders %}· {{ n.tenders | join('/') }} tenders{% endif %}
          {% endfor %}
      - type: markdown
        title: Buyers with most stored notices
        content: >
          {% for b in state_attr('sensor.raw_data_sweden_stored_notices', 'top_buyers') or [] %}
          - {{ b.name }} ({{ b.identifiers | join(', ') }}): {{ b.notices }}
          {% endfor %}

  # 26.5 / 26.6 Public footprint and peer comparison (only when configured).
  - title: Organisation
    path: organisation
    cards:
      - type: entities
        title: Selected organisation – public TED footprint
        entities:
          - sensor.selected_organisation_public_competitions_30_d
          - sensor.selected_organisation_estimated_value_30_d
          - sensor.selected_organisation_public_awards_30_d
          - sensor.selected_organisation_award_value_30_d
          - sensor.selected_organisation_public_changes_30_d
          - sensor.selected_organisation_contract_modifications_365_d
          - type: divider
          - sensor.selected_organisation_median_tenders_per_lot_365_d
          - sensor.selected_organisation_single_bid_share_365_d
          - sensor.selected_organisation_median_public_time_to_result_365_d

      # OWN · PEER · DIFFERENCE, one row per comparable metric.
      - type: entities
        title: Own vs peer group
        entities:
          - type: section
            label: Median tenders per lot, 365 d
          - sensor.selected_organisation_median_tenders_per_lot_365_d
          - sensor.peer_comparison_peer_median_tenders_per_lot_365_d
          - sensor.peer_comparison_own_vs_peer_median_tenders_delta
          - type: section
            label: Single-bid share, 365 d
          - sensor.selected_organisation_single_bid_share_365_d
          - sensor.peer_comparison_peer_single_bid_share_365_d
          - sensor.peer_comparison_own_vs_peer_single_bid_delta
          - type: section
            label: Public time to result, 365 d
          - sensor.selected_organisation_median_public_time_to_result_365_d
          - sensor.peer_comparison_peer_median_public_time_to_result_365_d
          - sensor.peer_comparison_own_vs_peer_time_to_result_delta

      - type: entities
        title: Selected country in the market, last 90 days
        entities:
          - sensor.peer_comparison_selected_country_value_rank_90_d
          - sensor.peer_comparison_selected_country_activity_rank_90_d
          - sensor.peer_comparison_selected_country_value_percentile_90_d

  # Phase 3: Sweden's defence spending, one line per source (plan §77).
  - title: Spending
    path: spending
    cards:
      - type: entities
        title: Sweden — defence spending
        entities:
          - entity: sensor.statskontoret_materiel_acquisition_ytd
            name: Materiel outturn YTD (Statskontoret, actual)
          - entity: sensor.statskontoret_materiel_acquisition_ytd_change
            name: … change vs previous year
          - entity: sensor.my_country_sweden_awarded_value_12_m
            name: Awarded contract value 12 m (TED)
          - entity: sensor.eurostat_defence_expenditure
            name: Defence expenditure (Eurostat)
          - entity: sensor.eurostat_defence_expenditure_rank
            name: … rank among reporting EU states
          - entity: sensor.eda_defence_expenditure
            name: Defence expenditure (EDA)
          - entity: sensor.nato_defence_expenditure_share_of_gdp
            name: Share of GDP (NATO, estimate)
          - entity: sensor.nato_defence_expenditure_share_of_gdp_rank
            name: … rank among allies
          - entity: sensor.sipri_military_expenditure
            name: Military expenditure (SIPRI, constant prices)
      - type: markdown
        title: Snapshot
        content: >-
          {{ states('sensor.statskontoret_spending_snapshot') }}

          {{ states('sensor.nato_nato_position') }}
      - type: history-graph
        title: Materiel acquisition, latest month
        hours_to_show: 8760
        entities:
          - sensor.statskontoret_materiel_acquisition_latest_month
